name: Publish to Open VSX

on:
  workflow_dispatch:
    inputs:
      create_namespace:
        description: Create the 9904099 namespace on the first publication
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
      - name: Download the exact GitHub Release artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          base_url="https://github.com/9904099/code-server-shared-terminals/releases/download/v${version}"
          curl --fail --location --silent --show-error \
            --output "code-server-shared-terminals-${version}.vsix" \
            "${base_url}/code-server-shared-terminals-${version}.vsix"
          curl --fail --location --silent --show-error \
            --output SHA256SUMS \
            "${base_url}/SHA256SUMS"
          sha256sum --check SHA256SUMS
      - name: Create Open VSX namespace
        if: ${{ inputs.create_namespace }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.0.2 create-namespace 9904099 -p "$OVSX_PAT"
      - name: Publish extension
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.0.2 publish code-server-shared-terminals-*.vsix -p "$OVSX_PAT"
